# Reference copy. The live block lives in the bible-explorer vhost on the Abacus VM:
#   ~/github_repos/Bible-Gematria-Interlinear-Explorer/deploy/bible-explorer.conf
# (host-only file, symlinked into /etc/nginx/conf.d/). Place before any broader location.
location ^~ /songsheet-picker/api/ {
    proxy_pass http://127.0.0.1:8098/api/;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 90s;
}
