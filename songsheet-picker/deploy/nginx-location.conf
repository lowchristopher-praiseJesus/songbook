# Reference copy. The live block lives in the bible-explorer vhost on the Abacus VM:
#   ~/github_repos/Bible-Gematria-Interlinear-Explorer/deploy/bible-explorer.conf
# (host-only file, symlinked into /etc/nginx/conf.d/). Placed after the adams-chart API block,
# before the broader /adams-chart/ and / locations.
    # SongSheet theme picker (service: /home/ubuntu/songsheet-picker, unit songsheet-picker, port 8098).
    # Called only by the SongSheet Cloudflare worker with a shared X-Picker-Key.
    location ^~ /songsheet-picker/api/ {
        proxy_pass http://127.0.0.1:8098/api/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }
