<!-- Run: npx serve . → open http://localhost:3000/experiments/audio-test.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎙 Audio Recording Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 max-w-2xl mx-auto">

  <h1 class="text-2xl font-bold mb-1">🎙 Audio Recording Test</h1>
  <p class="text-xs text-gray-500 mb-6">Record once · compare current vs new processing side by side</p>

  <!-- CONTROLS — visible in idle, countdown, recording -->
  <div id="controls" class="flex flex-wrap items-center gap-3 mb-4">
    <button id="btn-studio"
      class="text-xs px-3 py-1.5 rounded-lg border border-gray-600 bg-gray-800 text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      aria-label="Toggle studio mode">
      Studio Mode
    </button>
    <button id="btn-record"
      class="text-sm px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium focus:outline-none focus:ring-2 focus:ring-red-500"
      aria-label="Start recording">
      ● Record
    </button>
  </div>

  <!-- CAPTURE STATUS — visible during countdown + recording -->
  <div id="capture-status" class="hidden flex flex-wrap items-center gap-4 mb-3">
    <div class="flex items-center gap-2" aria-label="Input level">
      <div class="w-24 h-3 bg-gray-700 rounded-full overflow-hidden">
        <div id="vu-bar" class="h-full rounded-full bg-green-500 w-0"></div>
      </div>
      <span id="clip-label" class="hidden text-xs font-bold text-red-400">CLIP</span>
    </div>
    <span id="countdown-display" class="hidden text-3xl font-bold text-yellow-400 tabular-nums w-8 text-center" aria-live="polite" aria-label="Countdown"></span>
    <span id="timer-display"    class="hidden font-mono text-sm text-red-400 tabular-nums" aria-label="Recording duration"></span>
    <div class="flex gap-2">
      <button id="btn-pause"  class="hidden text-xs px-2 py-1 rounded border border-yellow-600 text-yellow-400 hover:bg-yellow-900/20" aria-label="Pause recording">⏸ Pause</button>
      <button id="btn-resume" class="hidden text-xs px-2 py-1 rounded border border-green-600  text-green-400  hover:bg-green-900/20" aria-label="Resume recording">▶ Resume</button>
      <button id="btn-stop"   class="hidden text-xs px-2 py-1 rounded border border-gray-600   text-gray-300   hover:bg-gray-700" aria-label="Stop recording">⏹ Stop</button>
    </div>
  </div>

  <!-- SETTINGS INFO — visible during countdown + recording -->
  <p id="settings-info" class="hidden text-xs text-gray-500 mb-4"></p>

  <!-- PROCESSING SPINNER -->
  <p id="spinner" class="hidden text-gray-400 text-sm mb-4 animate-pulse">⏳ Processing both versions…</p>

  <!-- COMPARISON — visible when done -->
  <div id="comparison" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
    <div class="bg-gray-800 rounded-xl p-4 flex flex-col gap-3">
      <h2 class="font-semibold text-sm text-gray-300">Current (v1)</h2>
      <p id="old-error" class="hidden text-xs text-red-400">Processing failed</p>
      <audio id="old-player" controls playsInline class="w-full hidden"></audio>
      <p id="old-stats" class="text-xs text-gray-500 leading-relaxed whitespace-pre-line"></p>
      <button id="btn-dl-old" class="hidden text-xs px-3 py-1.5 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 self-start">↓ Download WAV</button>
    </div>
    <div class="bg-gray-800 rounded-xl p-4 flex flex-col gap-3">
      <h2 class="font-semibold text-sm text-indigo-300">New (v2)</h2>
      <p id="new-error" class="hidden text-xs text-red-400">Processing failed</p>
      <audio id="new-player" controls playsInline class="w-full hidden"></audio>
      <p id="new-stats" class="text-xs text-gray-500 leading-relaxed whitespace-pre-line"></p>
      <button id="btn-dl-new" class="hidden text-xs px-3 py-1.5 rounded-lg border border-indigo-700 text-indigo-300 hover:bg-indigo-900/20 self-start">↓ Download WAV</button>
    </div>
  </div>
  <button id="btn-again" class="hidden text-sm px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium" aria-label="Record again">
    ● Record again
  </button>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────

    function show(id, condition = true) {
      document.getElementById(id).classList.toggle('hidden', !condition)
    }
    function hide(id) { show(id, false) }

    // ── Phase state machine ──────────────────────────────────────────────────
    // Phases: 'idle' | 'countdown' | 'recording' | 'processing' | 'done'

    let phase = 'idle'

    function setPhase(p) {
      phase = p
      const capturing = p === 'countdown' || p === 'recording'
      show('controls',          p === 'idle' || capturing)
      show('capture-status',    capturing)
      show('settings-info',     capturing)
      show('countdown-display', p === 'countdown')
      show('timer-display',     p === 'recording')
      show('btn-pause',         p === 'recording')
      show('btn-stop',          capturing)
      show('spinner',           p === 'processing')
      show('comparison',        p === 'done')
      show('btn-again',         p === 'done')
      hide('btn-resume')
    }

    setPhase('idle')

    // ── Studio Mode ──────────────────────────────────────────────────────────

    let studioMode = false

    function renderStudioBtn() {
      const btn = document.getElementById('btn-studio')
      if (studioMode) {
        btn.textContent = 'Studio Mode ◆'
        btn.className = 'text-xs px-3 py-1.5 rounded-lg border border-indigo-500 bg-indigo-900/30 text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500'
      } else {
        btn.textContent = 'Studio Mode'
        btn.className = 'text-xs px-3 py-1.5 rounded-lg border border-gray-600 bg-gray-800 text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500'
      }
    }

    document.getElementById('btn-studio').addEventListener('click', () => {
      studioMode = !studioMode
      renderStudioBtn()
    })

    renderStudioBtn()

    // ── Constants ────────────────────────────────────────────────────────────

    const STUDIO_CONSTRAINTS = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
      channelCount: 1,
      sampleSize: 16,
      latency: 0,
    }
    const DEFAULT_CONSTRAINTS = { channelCount: 1 }
    const BITRATE_MONO    = 128_000
    const BITRATE_STEREO  = 192_000

    // ── Recorder state ───────────────────────────────────────────────────────

    let micStream       = null
    let mediaRecorder   = null
    let recordedChunks  = []
    let actualChannels  = 1
    let actualBitrate   = BITRATE_MONO
    let cancelCountdown = null

    // ── Mic acquisition ──────────────────────────────────────────────────────

    async function acquireStream() {
      const constraints = studioMode ? STUDIO_CONSTRAINTS : DEFAULT_CONSTRAINTS
      micStream = await navigator.mediaDevices.getUserMedia({ audio: constraints })
      const settings = micStream.getAudioTracks()[0]?.getSettings() ?? {}
      actualChannels = settings.channelCount ?? 1
      actualBitrate  = actualChannels >= 2 ? BITRATE_STEREO : BITRATE_MONO
      document.getElementById('settings-info').textContent =
        `${actualChannels === 1 ? 'Mono' : 'Stereo'} · ${actualBitrate / 1000} kbps · ` +
        `browser DSP ${studioMode ? 'off' : 'on'}`
      startVU(micStream)
    }

    function releaseStream() {
      micStream?.getTracks().forEach(t => t.stop())
      micStream = null
    }

    // ── VU meter ─────────────────────────────────────────────────────────────

    let vuAudioCtx = null
    let vuRaf      = null

    function startVU(stream) {
      vuAudioCtx = new AudioContext()
      const src      = vuAudioCtx.createMediaStreamSource(stream)
      const analyser = vuAudioCtx.createAnalyser()
      analyser.fftSize = 1024
      src.connect(analyser)
      const buf    = new Float32Array(analyser.fftSize)
      const vuBar  = document.getElementById('vu-bar')
      const clipLbl = document.getElementById('clip-label')
      function tick() {
        analyser.getFloatTimeDomainData(buf)
        let peak = 0
        for (let i = 0; i < buf.length; i++) { const a = Math.abs(buf[i]); if (a > peak) peak = a }
        const db       = peak > 0 ? 20 * Math.log10(peak) : -Infinity
        const pct      = Math.max(0, Math.min(100, (db + 60) / 60 * 100))
        const clipping = db >= -1
        vuBar.style.width = pct + '%'
        vuBar.className = `h-full rounded-full ${clipping ? 'bg-red-500' : 'bg-green-500'}`
        clipLbl.classList.toggle('hidden', !clipping)
        vuRaf = requestAnimationFrame(tick)
      }
      vuRaf = requestAnimationFrame(tick)
    }

    function stopVU() {
      cancelAnimationFrame(vuRaf)
      vuRaf = null
      vuAudioCtx?.close()
      vuAudioCtx = null
      document.getElementById('vu-bar').style.width = '0%'
      document.getElementById('clip-label').classList.add('hidden')
    }

    // ── Countdown ────────────────────────────────────────────────────────────

    function runCountdown(onDone) {
      const display = document.getElementById('countdown-display')
      let remaining = 3
      display.textContent = remaining
      const id = setInterval(() => {
        remaining -= 1
        if (remaining <= 0) {
          clearInterval(id)
          display.textContent = ''
          onDone()
        } else {
          display.textContent = remaining
        }
      }, 1000)
      return () => { clearInterval(id); display.textContent = '' }
    }

    // ── Record button ────────────────────────────────────────────────────────

    document.getElementById('btn-record').addEventListener('click', async () => {
      try {
        setPhase('countdown')
        await acquireStream()
        cancelCountdown = runCountdown(() => {
          cancelCountdown = null
          startRecording()
        })
      } catch (err) {
        stopVU()
        releaseStream()
        setPhase('idle')
        alert(`Mic error: ${err.message}`)
      }
    })

    function startRecording() {
      recordedChunks = []
      const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']
        .find(t => MediaRecorder.isTypeSupported(t))
      const options = { audioBitsPerSecond: actualBitrate }
      if (mimeType) options.mimeType = mimeType
      mediaRecorder = new MediaRecorder(micStream, options)
      mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedChunks.push(e.data) }
      mediaRecorder.start(500)
      resetTimer()
      startTimer()
      setPhase('recording')
      acquireWakeLock()
    }

    // ── Stop button ──────────────────────────────────────────────────────────

    document.getElementById('btn-stop').addEventListener('click', () => {
      if (cancelCountdown) {
        cancelCountdown()
        cancelCountdown = null
        stopVU()
        releaseStream()
        setPhase('idle')
        return
      }
      stopRecording()
    })

    function stopRecording() {
      pauseTimer()
      stopVU()
      releaseWakeLock()
      setPhase('processing')
      mediaRecorder.onstop = async () => {
        releaseStream()
        await processAndShow()
      }
      mediaRecorder.stop()
    }

    async function processAndShow() {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' })
      const rawBuffer = await blob.arrayBuffer()

      const [oldResult, newResult] = await Promise.allSettled([
        processOld(rawBuffer.slice(0)),
        processNew(rawBuffer.slice(0)),
      ])

      // Old chain
      if (oldResult.status === 'fulfilled') {
        const { wavBuffer, stats } = oldResult.value
        const url = URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }))
        const player = document.getElementById('old-player')
        player.src = url
        show('old-player')
        document.getElementById('old-stats').textContent =
          `Peak-norm: ${stats.peakNorm}\nRatio: ${stats.ratio}:1 · Attack: ${stats.attackMs} ms`
        const dlBtn = document.getElementById('btn-dl-old')
        dlBtn.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = 'recording-v1.wav'; a.click() }
        show('btn-dl-old')
      } else {
        show('old-error')
      }

      // New chain
      if (newResult.status === 'fulfilled') {
        const { wavBuffer, stats } = newResult.value
        const url = URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }))
        const player = document.getElementById('new-player')
        player.src = url
        show('new-player')
        document.getElementById('new-stats').textContent =
          `LUFS: ${stats.measuredLUFS} → ${stats.targetLUFS}\nRatio: ${stats.ratio}:1 · Attack: ${stats.attackMs} ms`
        const dlBtn = document.getElementById('btn-dl-new')
        dlBtn.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = 'recording-v2.wav'; a.click() }
        show('btn-dl-new')
      } else {
        show('new-error')
      }

      setPhase('done')
    }

    // ── Timer ────────────────────────────────────────────────────────────────

    let timerInterval   = null
    let timerStartedAt  = null
    let pausedElapsedMs = 0

    function fmtTime(ms) {
      const s = Math.floor(ms / 1000)
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
    }

    function startTimer() {
      timerStartedAt = Date.now()
      timerInterval = setInterval(() => {
        const elapsed = pausedElapsedMs + (Date.now() - timerStartedAt)
        document.getElementById('timer-display').textContent = fmtTime(elapsed)
      }, 200)
    }

    function pauseTimer() {
      clearInterval(timerInterval)
      pausedElapsedMs += Date.now() - timerStartedAt
    }

    function resetTimer() {
      clearInterval(timerInterval)
      pausedElapsedMs = 0
      timerStartedAt  = null
      document.getElementById('timer-display').textContent = '0:00'
    }

    // ── Pause / Resume ───────────────────────────────────────────────────────

    document.getElementById('btn-pause').addEventListener('click', () => {
      if (mediaRecorder?.state === 'recording') {
        mediaRecorder.pause()
        pauseTimer()
        show('btn-resume')
        hide('btn-pause')
      }
    })

    document.getElementById('btn-resume').addEventListener('click', () => {
      if (mediaRecorder?.state === 'paused') {
        mediaRecorder.resume()
        startTimer()
        hide('btn-resume')
        show('btn-pause')
      }
    })

    // ── Record again ─────────────────────────────────────────────────────────

    document.getElementById('btn-again').addEventListener('click', () => {
      // Revoke object URLs to free memory
      const oldSrc = document.getElementById('old-player').src
      const newSrc = document.getElementById('new-player').src
      if (oldSrc) URL.revokeObjectURL(oldSrc)
      if (newSrc) URL.revokeObjectURL(newSrc)

      // Reset players and stats
      const oldPlayer = document.getElementById('old-player')
      const newPlayer = document.getElementById('new-player')
      oldPlayer.src = ''; newPlayer.src = ''
      hide('old-player'); hide('new-player')
      hide('old-error'); hide('new-error')
      document.getElementById('old-stats').textContent = ''
      document.getElementById('new-stats').textContent = ''
      hide('btn-dl-old'); hide('btn-dl-new')

      recordedChunks = []
      resetTimer()
      setPhase('idle')
    })

    // ── Wake lock ────────────────────────────────────────────────────────────

    let wakeLock = null

    async function acquireWakeLock() {
      try { wakeLock = await navigator.wakeLock.request('screen') } catch (_) {}
    }

    function releaseWakeLock() {
      wakeLock?.release()
      wakeLock = null
    }

    // ── WAV encoder ──────────────────────────────────────────────────────────

    function encodeWav(audioBuffer, gain, useDither = false) {
      const nc  = audioBuffer.numberOfChannels
      const sr  = audioBuffer.sampleRate
      const ns  = audioBuffer.length
      const dataSize = ns * nc * 2
      const buf  = new ArrayBuffer(44 + dataSize)
      const view = new DataView(buf)

      const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)) }
      str(0,'RIFF'); view.setUint32(4, 36 + dataSize, true); str(8,'WAVE')
      str(12,'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true)
      view.setUint16(22, nc, true); view.setUint32(24, sr, true)
      view.setUint32(28, sr * nc * 2, true); view.setUint16(32, nc * 2, true)
      view.setUint16(34, 16, true); str(36,'data'); view.setUint32(40, dataSize, true)

      let offset = 44
      for (let s = 0; s < ns; s++) {
        for (let c = 0; c < nc; c++) {
          const dither = useDither ? (Math.random() + Math.random() - 1) / 32768 : 0
          const sample = Math.max(-1, Math.min(1, audioBuffer.getChannelData(c)[s] * gain + dither))
          view.setInt16(offset, Math.round(sample * 32767), true)
          offset += 2
        }
      }
      return buf
    }

    // ── LUFS utilities (BS.1770-4 K-weighting, 48 kHz) ──────────────────────────

    function applyIIR(samples, b, a) {
      const out = new Float64Array(samples.length)
      for (let i = 0; i < samples.length; i++) {
        out[i] = b[0] * samples[i]
        if (i >= 1) { out[i] += b[1] * samples[i - 1] - a[1] * out[i - 1] }
        if (i >= 2) { out[i] += b[2] * samples[i - 2] - a[2] * out[i - 2] }
      }
      return out
    }

    function kWeight(samples) {
      // Stage 1: high-shelf pre-filter (48 kHz ITU-R BS.1770-4 coefficients)
      const HS_B = [1.53512485958697, -2.69169618940638, 1.19839281085285]
      const HS_A = [1.0, -1.69065929318241, 0.73248077421585]
      // Stage 2: high-pass RLB filter (48 kHz ITU-R BS.1770-4 coefficients)
      const HP_B = [1.0, -2.0, 1.0]
      const HP_A = [1.0, -1.99004745483398, 0.99007225036603]
      return applyIIR(applyIIR(samples, HS_B, HS_A), HP_B, HP_A)
    }

    function measureLUFS(audioBuffer) {
      const sr = audioBuffer.sampleRate
      const blockSamples = Math.round(0.4 * sr)   // 400ms
      const hopSamples   = Math.round(0.1 * sr)   // 100ms (75% overlap)

      // K-weight all channels
      const weighted = []
      for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
        weighted.push(kWeight(new Float64Array(audioBuffer.getChannelData(c))))
      }

      // Compute mean square power per 400ms block
      const totalSamples = audioBuffer.length
      const blockPowers = []
      for (let start = 0; start + blockSamples <= totalSamples; start += hopSamples) {
        let sum = 0
        for (const ch of weighted) {
          for (let i = start; i < start + blockSamples; i++) sum += ch[i] * ch[i]
        }
        blockPowers.push(sum / (blockSamples * weighted.length))
      }

      if (blockPowers.length === 0) return -Infinity

      // Absolute gate: −70 LUFS → mean power threshold
      const absThreshold = Math.pow(10, (-70 + 0.691) / 10)
      const gated1 = blockPowers.filter(p => p > absThreshold)
      if (gated1.length === 0) return -Infinity

      // Relative gate: −10 LU below ungated mean
      const ungatedMean = gated1.reduce((a, b) => a + b, 0) / gated1.length
      const relThreshold = ungatedMean * Math.pow(10, -10 / 10)
      const gated2 = gated1.filter(p => p > relThreshold)
      if (gated2.length === 0) return -Infinity

      const mean = gated2.reduce((a, b) => a + b, 0) / gated2.length
      return -0.691 + 10 * Math.log10(mean)
    }

    // ── processOld — current app chain ───────────────────────────────────────────

    async function processOld(rawBuffer) {
      const ctx = new AudioContext()
      const decoded = await ctx.decodeAudioData(rawBuffer)
      await ctx.close()

      const sr  = decoded.sampleRate
      const len = decoded.length
      const nc  = decoded.numberOfChannels
      const offline = new OfflineAudioContext(nc, len, sr)

      const src = offline.createBufferSource()
      src.buffer = decoded

      const hpf = offline.createBiquadFilter()
      hpf.type = 'highpass'; hpf.frequency.value = 80

      const comp = offline.createDynamicsCompressor()
      comp.threshold.value = -24; comp.knee.value = 10
      comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.15

      src.connect(hpf).connect(comp).connect(offline.destination)
      src.start()
      const processed = await offline.startRendering()

      // Peak scan
      let peak = 0
      for (let c = 0; c < processed.numberOfChannels; c++) {
        const data = processed.getChannelData(c)
        for (let i = 0; i < data.length; i++) {
          const a = Math.abs(data[i]); if (a > peak) peak = a
        }
      }
      const gain = peak > 0 ? 0.9 / peak : 1

      const wavBuffer = encodeWav(processed, gain, false)
      return { wavBuffer, stats: { peakNorm: 0.9, ratio: 4, attackMs: 5 } }
    }

    // ── processNew — improved chain ───────────────────────────────────────────────

    async function processNew(rawBuffer) {
      const ctx = new AudioContext()
      const decoded = await ctx.decodeAudioData(rawBuffer)
      await ctx.close()

      const sr  = decoded.sampleRate
      const len = decoded.length
      const nc  = decoded.numberOfChannels
      const offline = new OfflineAudioContext(nc, len, sr)

      const src = offline.createBufferSource()
      src.buffer = decoded

      const hpf = offline.createBiquadFilter()
      hpf.type = 'highpass'; hpf.frequency.value = 80

      const comp = offline.createDynamicsCompressor()
      comp.threshold.value = -24; comp.knee.value = 10
      comp.ratio.value = 2.5; comp.attack.value = 0.020; comp.release.value = 0.100

      const makeup = offline.createGain()
      makeup.gain.value = Math.pow(10, 4 / 20) // +4 dB

      src.connect(hpf).connect(comp).connect(makeup).connect(offline.destination)
      src.start()
      const processed = await offline.startRendering()

      // LUFS measurement
      const measuredLUFS = measureLUFS(processed)
      const targetLUFS   = -14
      let gain = Math.pow(10, (targetLUFS - measuredLUFS) / 20)

      // True-peak ceiling: −1 dBFS = 0.891
      let peak = 0
      for (let c = 0; c < processed.numberOfChannels; c++) {
        const data = processed.getChannelData(c)
        for (let i = 0; i < data.length; i++) {
          const a = Math.abs(data[i]); if (a > peak) peak = a
        }
      }
      const ceiling = 0.891
      if (peak * gain > ceiling) gain = ceiling / peak

      const wavBuffer = encodeWav(processed, gain, true) // TPDF dither
      return { wavBuffer, stats: { measuredLUFS: +measuredLUFS.toFixed(1), targetLUFS, ratio: 2.5, attackMs: 20 } }
    }
</script>
</body>
</html>
