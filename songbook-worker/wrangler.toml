name = "songbook-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "songbook-shares"

# APP_ORIGIN is set as a secret: wrangler secret put APP_ORIGIN
# LICENSE_SECRET is set as a secret: wrangler secret put LICENSE_SECRET
# LICENSE_TOKEN_SECRET is set as a secret: wrangler secret put LICENSE_TOKEN_SECRET

# SESSION_KV: run `wrangler kv namespace create SESSION_KV` and replace placeholder IDs below
[[kv_namespaces]]
binding = "SESSION_KV"
id = "4db84560ebae40cf90fb142ee84c8562"
preview_id = "ba821b606a42491893ccb6138f028435"

# COMMUNITY_DB: run `wrangler d1 create songbook-community` and paste the returned id below
[[d1_databases]]
binding = "DB"
database_name = "songbook-community"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"
